services:
  - type: web
    name: vishva-erp-backend
    runtime: node
    plan: free
    buildCommand: npm install --ignore-optional
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: test
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: "whatsapp:+14155238886"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MASTER_ENCRYPTION_KEY
        sync: false
      - key: PLATFORM_RAZORPAY_KEY_ID
        sync: false
      - key: PLATFORM_RAZORPAY_KEY_SECRET
        sync: false
      - key: PLATFORM_RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ── AI provider: free Gemini tier ────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      # ── Google Sign-In (OAuth 2.0 authorization-code flow) ───────
      # This exact URI must also be listed in Google Cloud Console under
      # the OAuth client's authorized redirect URIs.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://vishva-erp-app.onrender.com/api/auth/google/callback
      - key: GOOGLE_APP_REDIRECT_URI
        value: vishvaerp://auth
      # ── Google Meet + Sheets (service account) ───────────────────
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary
