apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
    // Windows long-path workaround. Gradle is invoked from a `subst` drive (Z:) so
    // the native C++ .cxx object paths stay under the 260-char ninja limit. Metro,
    // however, realpath-resolves its modules back to the real drive and fails to
    // hash them if run from Z: ("Failed to get the SHA-1 ..."). So pin the JS root
    // (where Metro runs) to the real path via VISHVA_JS_ROOT. The bundle output
    // must then also live under that real root, which VISHVA_BUILD_DIR handles.
    def realRoot = System.getenv("VISHVA_JS_ROOT")
    if (realRoot != null && !realRoot.isEmpty()) {
        root = file(realRoot)
        cliFile = file("${realRoot}/node_modules/react-native/cli.js")
    }
    def shortCodegenDir = System.getenv("VISHVA_CODEGEN_DIR")
    if (shortCodegenDir != null && !shortCodegenDir.isEmpty()) {
        codegenDir = file(shortCodegenDir)
    }
    def shortReactNativeDir = System.getenv("VISHVA_REACT_NATIVE_DIR")
    if (shortReactNativeDir != null && !shortReactNativeDir.isEmpty()) {
        reactNativeDir = file(shortReactNativeDir)
    }
    if (System.getenv("VISHVA_DISABLE_SOURCE_MAPS") == "true") {
        hermesFlags = ["-O"]
    }
}

def vishvaBuildDir = System.getenv("VISHVA_BUILD_DIR")
if (vishvaBuildDir != null && !vishvaBuildDir.isEmpty()) {
    buildDir = file(vishvaBuildDir)
}

def enableProguardInReleaseBuilds = true

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.vishvaerp"
    defaultConfig {
        applicationId "com.vishvaerp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "4.0.0"

        testBuildType System.getProperty("testBuildType", "debug")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        missingDimensionStrategy "reactNativeArchitectures", "arm64-v8a,armeabi-v7a"

        // Hermes bytecode optimization for smaller, faster release bundles
        if (enableProguardInReleaseBuilds) {
            resConfigs "en"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('VISHVA_STORE_FILE')) {
                storeFile file(VISHVA_STORE_FILE)
                storePassword VISHVA_STORE_PASSWORD
                keyAlias VISHVA_KEY_ALIAS
                keyPassword VISHVA_KEY_PASSWORD
            } else if (System.getenv("CI") != null) {
                throw new GradleException("Release signing requires VISHVA_STORE_FILE in CI/production builds")
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            crunchPngs false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            debuggable false
            crunchPngs true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Single universal APK - works on all ARM and x86_64 devices
    splits {
        abi {
            enable false
        }
    }

    // Packaging options to avoid duplicate file conflicts
    packagingOptions {
        pickFirst '**/libjsc.so'
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libhermes.so'
        pickFirst '**/libhermes-executor.so'
        pickFirst '**/libreactnativejni.so'
        pickFirst '**/libreact_nativemodulejni.so'
        pickFirst '**/libworklets.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }

    // Bundle configuration for AAB (Android App Bundle)
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    // Build flavor for staging environment
    flavorDimensions "environment"
    productFlavors {
        production {
            dimension "environment"
            applicationIdSuffix ""
            versionNameSuffix ""
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"

    // AndroidX Core
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.3"

    // Splash screen
    implementation "androidx.core:core-splashscreen:1.0.1"

    // WorkManager for background tasks
    implementation "androidx.work:work-runtime-ktx:2.10.0"
}

// Apply google-services plugin if google-services.json exists
def googleServicesFile = file('google-services.json')
if (googleServicesFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
}
