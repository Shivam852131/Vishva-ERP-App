# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-17.0.19.10-hotspot
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true

reactNativeArchitectures=arm64-v8a
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=false

# R8 full mode for aggressive optimization
android.enableR8.fullMode=true

# Resource optimization
android.enableResourceOptimizations=true

# New resource shrinker (experimental)
android.experimental.enableNewResourceShrinker=true

# Kotlin incremental compilation
kotlin.incremental=true

# Redirect cmake build to short path (avoid Windows 260-char limit)
android.externalNativeBuild.cmake.buildDirectory=C\:\\dev\\cxx
