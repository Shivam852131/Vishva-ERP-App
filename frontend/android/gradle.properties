# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# NOTE: do not pin org.gradle.java.home here — this file is shared with CI,
# where that Windows path does not exist and the build fails immediately.
# The machine-specific JDK lives in %USERPROFILE%\.gradle\gradle.properties;
# CI falls back to JAVA_HOME from actions/setup-java (Temurin 17).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# arm64-v8a = modern phones, armeabi-v7a = older/budget phones.
# Both = the APK installs and runs on virtually every Android phone.
reactNativeArchitectures=x86_64
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=false

# R8 full mode for aggressive optimization
android.enableR8.fullMode=true

# Resource optimization
android.enableResourceOptimizations=true

# New resource shrinker (experimental)
android.experimental.enableNewResourceShrinker=true

# Kotlin incremental compilation
kotlin.incremental=false

# Redirect cmake build to short path (avoid Windows 260-char limit).
# Windows-only: kept in %USERPROFILE%\.gradle\gradle.properties so the Linux
# CI runner does not try to build inside a directory literally named "C:\dev\cxx".
