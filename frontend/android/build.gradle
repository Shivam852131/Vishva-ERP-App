buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        // 26 is the floor for the Jitsi Meet SDK (react-native-webrtc + media
        // services); was 24 before in-app live classes were enabled.
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        // AGP version used by @jitsi/react-native-sdk's own buildscript
        // (its android/build.gradle resolves com.android.tools.build:gradle
        // from this property). Must match the RN gradle plugin's AGP pin
        // (@react-native/gradle-plugin libs.versions.toml: agp = 8.11.0).
        gradlePluginVersion = "8.11.0"
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Firebase Google Services plugin
        classpath("com.google.gms:google-services:4.4.2")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "$rootDir/../node_modules/react-native/android" }
        // Jitsi Meet SDK binary artifacts (org.jitsi.react:jitsi-meet-sdk) and
        // its dependencies that are not on mavenCentral.
        maven { url "https://github.com/jitsi/jitsi-maven-repository/raw/master/releases" }
        maven { url "https://jitpack.io" }
    }
}

// Redirect cmake build directory for ALL subprojects to avoid
// Windows 260-char path limit in node_modules/.cxx
subprojects { subproject ->
    subproject.plugins.whenPluginAdded { plugin ->
        if (plugin.class.name.contains('com.android')) {
            subproject.afterEvaluate {
                try {
                    android.externalNativeBuild.cmake.buildDirectory = new File("C:/dev/cxx/${subproject.name}")
                } catch (Exception e) {
                    // Not all android projects have cmake
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
