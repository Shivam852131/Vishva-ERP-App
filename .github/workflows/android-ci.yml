name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# Superseded pushes cancel their in-flight build so artifacts always
# reflect the newest commit on main.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Jitsi Meet SDK's peer tree must be installed with
      # --legacy-peer-deps (same as local installs). postinstall
      # re-applies the nitro/document-picker/amplitude node_modules
      # patches, which the native build depends on.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Make gradlew executable
        run: chmod +x frontend/android/gradlew

      # Builds both flavors' debug variants (stagingDebug +
      # productionDebug); debug.keystore is committed, so no signing
      # secrets are needed and R8 stays out of the way.
      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VishvaERP-debug-${{ github.run_number }}
          # AGP writes flavored APKs to apk/<flavor>/<buildType>/.
          path: frontend/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
