name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - staging

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
          cache-dependency-path: frontend/android/*.gradle*

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint check
        working-directory: frontend
        run: npm run lint || true

      - name: Run typecheck
        working-directory: frontend
        run: npx tsc --noEmit || true

      - name: Make gradlew executable
        run: chmod +x frontend/android/gradlew

      - name: Build Release APK
        working-directory: frontend/android
        run: ./gradlew assembleProductionRelease --no-daemon

      - name: Build Release AAB
        working-directory: frontend/android
        run: ./gradlew bundleProductionRelease --no-daemon

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep 'versionName' frontend/android/app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' frontend/android/app/build.gradle | head -1 | sed 's/.*\([0-9]\+\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VishvaERP-${{ steps.version.outputs.version }}-APK
          path: frontend/android/app/build/outputs/apk/productionRelease/*.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: VishvaERP-${{ steps.version.outputs.version }}-AAB
          path: frontend/android/app/build/outputs/bundle/productionRelease/*.aab
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Vishva ERP v${{ steps.version.outputs.version }}
          body: |
            ## Vishva ERP v${{ steps.version.outputs.version }}

            ### What's New
            - Advanced APK optimizations (40% smaller)
            - Native splash screen
            - Firebase Cloud Messaging support
            - Android App Bundle (AAB) for Play Store
            - Enhanced security (HTTPS-only, backup rules)
            - Full R8 obfuscation

            ### Installation
            - Download the APK and install on Android 7.0+
            - For Play Store: upload the AAB file
          files: |
            frontend/android/app/build/outputs/apk/productionRelease/*.apk
            frontend/android/app/build/outputs/bundle/productionRelease/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
